# Verified local release; plain `docker compose up -d` uses these images.
services:
  web:
    image: datasetui-web:release-20261002-refactor-v1
  api:
    image: datasetui-api:release-20261002-refactor-v1
    environment:
      DATASETUI_QUEUE_SUFFIX: relative-v1
      DATASETUI_CPU_QUEUE: cpu-adaptive-v1
      DATASETUI_ADAPTIVE_ENABLED: "1"
      DATASETUI_PARALLEL_MAX_JOBS: "3"
      DATASETUI_RELATIVE_TIMEOUT_SECONDS: "86400"
  worker-io:
    image: datasetui-api:release-20261002-refactor-v1
  worker-cpu:
    image: datasetui-processor:release-20261002-refactor-v1
    environment:
      DATASETUI_PROCESSOR_ENGINE: lerobot-v3
      TORCHINDUCTOR_CACHE_DIR: /data/cache/torchinductor
  worker-converter-v21:
    image: datasetui-converter:release-20261002-refactor-v1
  # Keep legacy workers alive for already-dispatched jobs. Never use global
  # --force-recreate / down during this rolling deployment.
  worker-cpu-relative:
    profiles: [legacy-relative]
    extends:
      file: compose.yaml
      service: worker-cpu
    image: datasetui-processor:release-20261002-refactor-v1
    command: [rq, worker, --url, "redis://redis:6379/0", --serializer, rq.serializers.JSONSerializer, cpu-relative-v1]
    cpus: 4.0
    mem_limit: 32g
    environment:
      DATASETUI_PROCESSOR_ENGINE: lerobot-v3
      TORCHINDUCTOR_CACHE_DIR: /data/cache/torchinductor
      DATASETUI_RELATIVE_MAX_SCRATCH_BYTES: "17179869184"
      DATASETUI_RELATIVE_SCRATCH_DIR: /data/staging
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
  worker-io-relative:
    extends:
      file: compose.yaml
      service: worker-io
    image: datasetui-api:release-20261002-refactor-v1
    command: [rq, worker, --url, "redis://redis:6379/0", --serializer, rq.serializers.JSONSerializer, io-relative-v1]
    cpus: 1.0
    mem_limit: 4g
  worker-converter-relative:
    extends:
      file: compose.yaml
      service: worker-converter-v21
    image: datasetui-converter:release-20261002-refactor-v1
    command: [rq, worker, --url, "redis://redis:6379/0", --serializer, rq.serializers.JSONSerializer, converter-v21-relative-v1]
    cpus: 2.0
    mem_limit: 8g
  worker-adaptive:
    extends:
      file: compose.yaml
      service: worker-cpu
    image: datasetui-processor:release-20261002-refactor-v1
    command: [python, -m, datasetui.adaptive_pool]
    cpus: 12.0
    mem_limit: 48g
    stop_grace_period: 25h
    environment:
      DATASETUI_ADAPTIVE_QUEUES: cpu,cpu-relative-v1,cpu-adaptive-v1
      DATASETUI_PARALLEL_MAX_JOBS: "3"
      DATASETUI_RESOURCE_RESERVE_PERCENT: "30"
      DATASETUI_PARALLEL_JOB_CPUS: "4"
      DATASETUI_PARALLEL_JOB_MEMORY_GIB: "8"
      DATASETUI_PROCESSOR_ENGINE: lerobot-v3
      TORCHINDUCTOR_CACHE_DIR: /data/cache/torchinductor
      DATASETUI_RELATIVE_MAX_SCRATCH_BYTES: "17179869184"
      DATASETUI_RELATIVE_SCRATCH_DIR: /data/staging
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

  worker-gpu:
    image: datasetui-segmentation:release-20261002-refactor-v1
