# Executable parity inventory for the pinned Hugging Face Space revision.
# Every capability is linked to an executable Vitest title at the pinned revision.
space_repo: lerobot/visualize_dataset
space_commit: d724744111cae6feb9a2194e607e71749813a97a
status_definitions:
  contract-tested: The data/schema prerequisite is exercised in Task 1.
  planned: The acceptance test is named here and must pass in its implementation task.
  parity-tested: The implementation is present and its named parity test passes.
